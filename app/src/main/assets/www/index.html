<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anotador de Truco</title>
<script src="js/tailwind.min.js"></script>
<link href="css/fonts.css" rel="stylesheet">
<script src="js/Tone.js"></script>
<style>
:root{--bg:#09180e;--card:#0f2415;--card2:#0b1c10;--gold:#b8943a;--golddim:rgba(184,148,58,.25);--cream:#eedea0;--muted:#7a9e80;--accent:#d4af37;--accentl:#f0cc5a;--mh:#e06830;--bh:#c0253a;--stick:#b89050;--burnt:#1e2e22;--burnth:#18261c}
html{height:100%;background:#09180e}
body{height:100%;font-family:'Rye',serif;color:var(--cream);-webkit-user-select:none;user-select:none;overflow:hidden;touch-action:manipulation;background:var(--bg);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 12px)}
.screen{height:calc(var(--vh,1vh)*100);display:flex;flex-direction:column}
.screen.hidden{display:none}
.card-bg{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--golddim);box-shadow:0 8px 32px rgba(0,0,0,.6),inset 0 1px 0 rgba(212,175,55,.08)}
.gold-div{height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);flex-shrink:0}
.pf{font-family:'Rye',serif;font-weight:400}
.gold-text{color:var(--accent);text-shadow:0 0 20px rgba(212,175,55,.4)}
.score-number{font-family:'Rye',serif;font-weight:400;line-height:1;letter-spacing:-.02em}
.team-name-container{display:flex;align-items:center;justify-content:center;padding:.5rem .5rem .3rem;cursor:pointer;flex-shrink:0;gap:.3rem}
.team-name{font-size:clamp(.8rem,2.5vw,1rem);font-weight:700;text-align:center;word-break:break-word;line-height:1.2;text-transform:uppercase;letter-spacing:.1em}
.btn{display:flex;align-items:center;justify-content:center;gap:.4rem;border-radius:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;transition:all .15s ease;cursor:pointer;border:none;outline:none;box-shadow:0 4px 15px rgba(0,0,0,.5)}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,#1a7a3e,#0f4f27);color:#a0ffc0;border:1px solid rgba(160,255,192,.2);box-shadow:0 4px 20px rgba(26,122,62,.4)}
.btn-secondary{background:linear-gradient(135deg,#5a1a6e,#3a0e47);color:#e0aaff;border:1px solid rgba(224,170,255,.2)}
.btn-action{background:linear-gradient(135deg,#7a5a1a,#4e380e);color:var(--accentl);border:1px solid rgba(212,175,55,.3)}
.btn-win{background:linear-gradient(135deg,#1a6e3a,#0e4525);color:#80ffb0;border:1px solid rgba(128,255,176,.2)}
.btn-danger{background:linear-gradient(135deg,#7a1a1a,#4e0e0e);color:#ffaaaa;border:1px solid rgba(255,170,170,.2)}
.btn-flor{background:linear-gradient(135deg,#c05000,#7a2800);color:#ffe0a0;border:1px solid rgba(255,180,80,.3);box-shadow:0 4px 16px rgba(192,80,0,.4)}
.btn-score{border-radius:.5rem;font-family:'Rye',serif;font-weight:400;font-size:clamp(.95rem,3.5vw,1.25rem);padding:.45rem .2rem;flex:1;min-width:0;cursor:pointer;transition:all .15s ease;box-shadow:0 3px 10px rgba(0,0,0,.4);text-transform:uppercase;letter-spacing:.04em}
.btn-score:active{transform:scale(.92)}
.btn-score-add{background:linear-gradient(160deg,#1d5c30,#0f3519);color:#80ffaa;border:1px solid rgba(128,255,170,.2)}
.btn-score-subtract{background:linear-gradient(160deg,#5c1d1d,#350f0f);color:#ffaaaa;border:1px solid rgba(255,170,170,.2)}
.fosforo-container{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:.3rem .25rem;background:rgba(0,0,0,.18);scrollbar-width:thin;scrollbar-color:var(--golddim) transparent}
.fosforo-container::-webkit-scrollbar{width:3px}
.fosforo-container::-webkit-scrollbar-thumb{background:var(--golddim);border-radius:2px}
.fosforo-group{position:relative;width:45px;height:45px;flex-shrink:0}
.fosforo{position:absolute;background-color:var(--stick);border-radius:2px;transition:background-color .4s ease}
.fosforo::before{content:'';position:absolute;width:11px;height:11px;border-radius:50%;left:-3.5px;top:-3.5px;transition:background-color .4s ease}
.fosforo.malas::before{background-color:var(--mh);box-shadow:0 0 5px var(--mh)}
.fosforo.buenas::before{background-color:var(--bh);box-shadow:0 0 5px var(--bh)}
.fosforo.quemado{background-color:var(--burnt)}
.fosforo.quemado::before{background-color:var(--burnth);box-shadow:none}
.tally-label{font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-align:center;margin-bottom:.25rem}
.tally-label.malas{color:var(--mh)}
.tally-label.buenas{color:var(--bh)}
.tally-groups-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:2px 4px 6px}
#pica-pica-container{height:40px;flex-shrink:0;margin:0 .5rem .3rem;position:relative}
#pica-pica-banner{position:absolute;width:100%;background:linear-gradient(135deg,#8b0000,#cc4400 50%,#8b0000);color:#ffe080;padding:.4rem 1rem;border-radius:.5rem;font-weight:900;font-size:.75rem;letter-spacing:.2em;text-align:center;border:1px solid rgba(255,200,0,.3);box-shadow:0 2px 12px rgba(139,0,0,.5);transition:opacity .3s ease,transform .3s ease;opacity:0;transform:translateY(-8px);pointer-events:none}
#pica-pica-banner.visible{opacity:1;transform:translateY(0)}
#fire-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.particle{position:absolute;bottom:-50px;border-radius:50%;opacity:0;animation:rise 2s ease-out forwards;background:radial-gradient(circle,rgba(255,220,0,.85) 0%,rgba(255,140,0,.65) 40%,rgba(255,69,0,.2) 80%,transparent 100%);filter:blur(2px)}
@keyframes rise{0%{transform:translateY(0) scale(1);opacity:.9}100%{transform:translateY(-100vh) scale(0);opacity:0}}
.input-field{width:100%;padding:.5rem .75rem;border-radius:.5rem;background-color:#060f09;border:1px solid rgba(184,148,58,.3);color:var(--cream);transition:all .2s ease;-webkit-user-select:text;user-select:text}
.input-field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(212,175,55,.25)}
.input-field option{background-color:#0d1f13;color:var(--cream)}
.input-field option:disabled{color:#3a5a3a}
.toggle-label{transition:background-color .2s ease-in-out}
.toggle-checkbox{transition:transform .2s ease-in-out}
.toggle-checkbox:checked{transform:translateX(1rem)}
.toggle-checkbox:checked+.toggle-label{background-color:#1a7a3e}
#clp-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:50;pointer-events:none}
.particle{position:absolute;bottom:-30px;border-radius:50% 50% 35% 35%;opacity:0;animation:rise var(--dur,2s) ease-out forwards;animation-delay:var(--del,0s);filter:blur(1.5px);}
@keyframes rise{0%{transform:translateY(0) translateX(0) scale(1);opacity:.95}25%{opacity:1}100%{transform:translateY(-96vh) translateX(var(--sx,0px)) scale(.05);opacity:0}}
.suit{font-size:1.5rem;opacity:.12;pointer-events:none;position:absolute;user-select:none}
.opt-row{display:flex;align-items:center;justify-content:space-between;padding:.5rem .75rem;background:rgba(0,0,0,.3);border-radius:.5rem;border:1px solid var(--golddim)}
#game-container.gallo-mode{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
#game-container.gallo-mode .card-j0{grid-column:1;grid-row:1/3}
#game-container.gallo-mode .card-j1{grid-column:2;grid-row:1}
#game-container.gallo-mode .card-j2{grid-column:2;grid-row:2}
@media (orientation:landscape) and (max-height:520px){#game-container.gallo-mode{grid-template-columns:1fr 1fr 1fr!important;grid-template-rows:1fr!important}#game-container.gallo-mode .card-j0,#game-container.gallo-mode .card-j1,#game-container.gallo-mode .card-j2{grid-column:auto!important;grid-row:auto!important}}
#modal-footer .btn{padding:.7rem 1.6rem!important;font-size:.9rem!important;min-width:7rem}
.tap-zone{flex:1;min-height:0;display:flex;flex-direction:column;cursor:pointer;position:relative;-webkit-tap-highlight-color:rgba(255,255,255,.06);overflow:hidden}
.tap-zone:active{opacity:.82}
.tutorial-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:20;flex-direction:column;gap:.5rem}
.tutorial-finger{font-size:2.8rem;animation:finger-tap 1s ease-in-out 3 forwards}
.tutorial-txt{font-size:.7rem;letter-spacing:.12em;color:rgba(255,200,100,.8);text-transform:uppercase}
@keyframes finger-tap{0%{transform:scale(1) translateY(0);opacity:.8}45%{transform:scale(.75) translateY(8px);opacity:1}55%{transform:scale(.75) translateY(8px);opacity:1}100%{transform:scale(1) translateY(0);opacity:.8}}
.tutorial-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10;pointer-events:all;animation:fade-in-bd .4s ease forwards}
@keyframes fade-in-bd{from{opacity:0}to{opacity:1}}
.tutorial-card-active{position:relative!important;z-index:12!important;border-radius:1rem;box-shadow:0 0 0 3px rgba(212,175,55,.5),0 0 40px rgba(212,175,55,.2)!important}.tutorial-card-active .tap-zone{pointer-events:none!important}

/* LANDSCAPE COMPACTO */
@media (orientation:landscape) and (max-height:520px){
/* Setup screen en landscape: permitir scroll y compactar */
#screen-setup{align-items:flex-start!important;justify-content:flex-start!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch;padding:.5rem!important}
#screen-setup .card-bg{margin:auto;padding:.75rem!important;gap:.5rem!important}
#screen-setup h1{font-size:1.8rem!important;margin-bottom:0!important}
#screen-setup p.text-xs{display:none}
#screen-setup .gold-div.mt-3{margin-top:.3rem!important}
#screen-setup .input-field{padding:.3rem .5rem!important}
#screen-setup .btn-primary{padding:.5rem 1rem!important}
#screen-setup .opt-row{padding:.3rem .5rem!important}
#screen-game header{padding:.15rem .5rem .1rem!important}
.team-name-container{padding:.2rem .3rem .1rem!important}
.team-name{font-size:clamp(.65rem,2vw,.8rem)!important}
.team-score{font-size:clamp(1.4rem,6vw,2.5rem)!important;padding:.05rem 0!important}
.fosforo-container{flex-direction:row!important;gap:.3rem;padding:.2rem .2rem!important}
.fosforo-container>div{flex:1;min-width:0;width:auto!important}
.tally-label{font-size:.5rem!important;margin-bottom:.15rem!important}
.btn-score{padding:.28rem .1rem!important;font-size:clamp(.7rem,2.4vw,.95rem)!important}
#pica-pica-container{height:28px!important}
#pica-pica-banner{padding:.2rem .5rem!important;font-size:.6rem!important}
#game-container{gap:.25rem!important}
}
</style>
</head>
<body>
<div id="fire-overlay"></div>
<!-- SETUP -->
<div id="screen-setup" class="screen items-center justify-center p-4 relative overflow-hidden">
<span class="suit" style="top:4%;left:4%"><img src="img/espada.png" alt="img" width="50" /></span><span class="suit" style="top:4%;right:4%"><img src="img/basto.png" alt="img" width="50" /></span>
<span class="suit" style="bottom:4%;left:4%"><img src="img/oro.png" alt="img" width="50" /></span><span class="suit" style="bottom:4%;right:4%"><img src="img/copa.png" alt="img" width="50" /></span>
<div class="w-full max-w-md card-bg p-5 rounded-2xl flex flex-col gap-4">
<div class="text-center">
<h1 class="pf text-5xl gold-text tracking-wide">TRUCO</h1>
<p class="text-xs tracking-widest uppercase mt-1" style="color:var(--muted)">Anotador Profesional</p>
<div class="gold-div mt-3"></div>
</div>
<div class="flex flex-col gap-3">
<div>
<label for="game-mode" class="block mb-1 text-xs font-semibold tracking-widest uppercase" style="color:var(--muted)">Modo de Juego</label>
<select id="game-mode" class="input-field"><option value="quick">Partida Rápida</option><option value="gallo">Truco Gallo (1 vs 2)</option><option value="tournament">Torneo de Parejas</option></select>
</div>
<div>
<label for="max-score" class="block mb-1 text-xs font-semibold tracking-widest uppercase" style="color:var(--muted)">Puntos a Jugar</label>
<select id="max-score" class="input-field"><option value="15">15 puntos</option><option value="30" selected>30 puntos</option><option value="40">40 puntos</option></select>
</div>
<div id="tournament-setup" class="hidden flex flex-col gap-3 pt-3" style="border-top:1px solid var(--golddim)">
<h2 class="pf text-lg text-center gold-text">Configurar Torneo</h2>
<div class="flex gap-2">
<div class="w-1/2"><label for="player-count" class="block mb-1 text-xs" style="color:var(--muted)">Jugadores</label><input type="number" id="player-count" value="6" min="2" max="24" class="input-field"></div>
<div class="w-1/2"><label for="players-per-team" class="block mb-1 text-xs" style="color:var(--muted)">Por Equipo</label><select id="players-per-team" class="input-field"><option value="2">2</option><option value="3" selected>3</option></select></div>
</div>
<div class="opt-row mb-1"><label for="random-teams-toggle" class="font-semibold text-sm">Armar parejas aleatorias</label><div class="relative inline-block w-10 align-middle"><input type="checkbox" id="random-teams-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" checked><label for="random-teams-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer"></label></div></div>
<div id="player-names-container" class="flex flex-col gap-1 max-h-48 overflow-y-auto pr-1"></div>
<p id="tournament-error" class="text-red-400 text-center hidden text-xs">Nombres duplicados.</p>
</div>
<div id="gallo-setup" class="hidden flex flex-col gap-3 pt-3" style="border-top:1px solid var(--golddim)">
<h2 class="pf text-lg text-center gold-text">Truco Gallo</h2>
<p class="text-xs text-center" style="color:var(--muted)">1 jugador solo vs 2 oponentes</p>
<input type="text" id="gallo-p1" placeholder="Jugador 1" class="input-field">
<input type="text" id="gallo-p2" placeholder="Jugador 2" class="input-field">
<input type="text" id="gallo-p3" placeholder="Jugador 3" class="input-field">
</div>
<div class="gold-div"></div>
<div class="flex flex-col gap-2">
<div class="hidden"><input type="checkbox" id="flor-toggle"><input type="checkbox" id="pica-pica-toggle"><div id="pica-pica-option-container"></div></div>
<div class="gold-div"></div>
<div class="flex flex-col gap-2">
<div class="opt-row"><label for="keep-awake-toggle" class="font-semibold text-sm">Mantener pantalla activa</label><div class="relative inline-block w-10 align-middle"><input type="checkbox" id="keep-awake-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"><label for="keep-awake-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer"></label></div></div>
</div>
</div>
<button id="start-btn" class="btn btn-primary w-full py-3 text-base mt-2">Empezar Partida</button>
</div>
</div>
</div>
<!-- GAME -->
<div id="screen-game" class="screen hidden p-2">
<header style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:.4rem .75rem .3rem;flex-shrink:0">
<div class="flex justify-start"><button id="back-to-menu-btn" class="btn btn-danger py-2 px-3 text-xs">← Volver</button></div>
<div id="game-history-btn-container" class="flex justify-center"></div>
<div class="flex justify-end"><button id="sound-toggle-btn" class="btn btn-action p-2"></button></div>
</header>
<div id="pica-pica-container"><div id="pica-pica-banner">⚡ PICA-PICA ⚡</div></div>
<main id="game-container" class="flex-grow grid grid-cols-2 gap-2 overflow-hidden"></main>
</div>
<!-- TOURNAMENT -->
<div id="screen-tournament" class="screen hidden p-3">
<div class="w-full max-w-4xl mx-auto card-bg p-4 rounded-2xl flex flex-col h-full">
<h1 class="pf text-2xl text-center mb-3 gold-text flex-shrink-0">Torneo</h1>
<div class="gold-div mb-3"></div>
<div id="rounds-container" class="space-y-3 overflow-y-auto flex-grow p-1" style="scrollbar-width:thin;scrollbar-color:var(--golddim) transparent"></div>
<div class="gold-div mt-3"></div>
<div class="flex flex-wrap gap-2 justify-center mt-3 flex-shrink-0">
<button id="add-round-btn" class="btn btn-win py-2 px-3 text-xs">+ Ronda</button>
<button id="add-team-btn" class="btn btn-action py-2 px-3 text-xs">+ Pareja</button>
<button id="tournament-history-btn" class="btn btn-secondary py-2 px-3 text-xs">Historial</button>
<button id="back-to-setup-btn" class="btn btn-danger py-2 px-3 text-xs">Menú</button>
<button id="finish-tournament-btn" class="btn btn-danger py-2 px-3 text-xs">✕ Finalizar Torneo</button>
</div>
</div>
</div>
<!-- MODAL -->
<div id="modal-container" class="hidden fixed inset-0 bg-black bg-opacity-80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
<div class="card-bg p-6 rounded-2xl shadow-xl w-full max-w-lg relative" style="border-color:var(--gold)">
<button id="modal-close-btn" class="absolute top-3 right-3 text-2xl font-bold hover:text-white transition" style="color:var(--muted)">&times;</button>
<h2 id="modal-title" class="pf text-2xl mb-4 gold-text text-center"></h2>
<div id="modal-body" class="text-base max-h-72 overflow-y-auto" style="color:var(--cream)"></div>
<div id="modal-footer" class="mt-4 flex flex-wrap justify-center gap-2"></div>
</div>
</div>
<div id="clp-modal">
<div class="pf text-6xl text-center gold-text" style="text-shadow:0 0 30px var(--accent),0 0 60px rgba(212,175,55,.5)">¡Muy bien!</div>
</div>
<script type="module">
let state={};let sounds={};let soundEnabled=true;let soundsInitialized=false;let pointUpdateQueue=[];let isProcessingQueue=false;
const DOM=Object.fromEntries(Array.from(document.querySelectorAll('[id]')).map(el=>[el.id.replace(/-./g,m=>m[1].toUpperCase()),el]));
DOM.body=document.body;
const ICONS={soundOn:`<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`,soundOff:`<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 5V5z"></path><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>`};
function setupSounds(){
const verb=new Tone.Reverb({decay:1.5,wet:.28}).toDestination();
const verb2=new Tone.Reverb({decay:2.5,wet:.4}).toDestination();
sounds.click=new Tone.MembraneSynth({pitchDecay:.018,octaves:5,envelope:{attack:.001,decay:.07,sustain:0,release:.06},volume:-8}).toDestination();
sounds.point=new Tone.Synth({oscillator:{type:'sine'},envelope:{attack:.001,decay:.09,sustain:0,release:.07},volume:-24}).connect(verb);
sounds.undo=new Tone.Synth({oscillator:{type:'sine'},envelope:{attack:.005,decay:.22,sustain:0,release:.18},volume:-16}).connect(verb);
sounds.win=new Tone.PolySynth(Tone.Synth,{oscillator:{type:'triangle8'},envelope:{attack:.03,decay:.6,sustain:.45,release:2.2},volume:-7}).connect(verb2);
const filt=new Tone.Filter({type:'bandpass',frequency:350,Q:.7}).connect(verb);
new Tone.LFO({frequency:2.5,min:180,max:900}).connect(filt.frequency).start();
sounds.fire=new Tone.NoiseSynth({noise:{type:'pink'},envelope:{attack:.12,decay:.9,sustain:.35,release:.9},volume:-5}).connect(filt);
}
function playSound(s){if(!soundEnabled||!sounds[s]||Tone.context.state!=='running')return;const n=Tone.now();
if(s==='click')sounds.click.triggerAttackRelease('C2','32n',n);
else if(s==='point')sounds.point.triggerAttackRelease('E5','16n',n);
else if(s==='undo'){sounds.undo.frequency.setValueAtTime(660,n);sounds.undo.frequency.exponentialRampToValueAtTime(280,n+.2);sounds.undo.triggerAttackRelease('A3','8n',n);}
else if(s==='win'){sounds.win.triggerAttackRelease(['C4','E4','G4'],'4n',n);sounds.win.triggerAttackRelease(['C5','E5','G5','C6'],'2n',n+.22);}
else if(s==='fire')sounds.fire.triggerAttackRelease('1.5s',n);
}
function switchScreen(id){Object.values(DOM).forEach(el=>{if(el.id&&el.id.startsWith('screen'))el.classList.add('hidden')});DOM[id.replace(/-./g,m=>m[1].toUpperCase())].classList.remove('hidden')}
function showModal(title,bodyHtml,footerButtons=[],isBlocking=false){DOM.modalTitle.textContent=title;DOM.modalBody.innerHTML=bodyHtml;DOM.modalFooter.innerHTML='';DOM.modalContainer.dataset.blocking=isBlocking;DOM.modalCloseBtn.style.display=isBlocking?'none':'block';const buttons=footerButtons.length>0?footerButtons:[{text:'Cerrar',classes:'bg-gray-700'}];buttons.forEach(c=>{const b=document.createElement('button');b.textContent=c.text;b.className=`btn ${c.classes}`;b.onclick=()=>{if(c.onClick)c.onClick();if(c.closesModal!==false)hideModal()};DOM.modalFooter.appendChild(b)});DOM.modalContainer.classList.remove('hidden')}
function hideModal(){DOM.modalContainer.classList.add('hidden');delete DOM.modalContainer.dataset.blocking}
function getGameSettings(){return{flor:false,picaPica:false,maxScore:parseInt(DOM.maxScore.value)}}
function startGame(initialState){if(initialState==='new_quick'){state.game={mode:'quick',teams:[{name:'Nosotros',score:0,color:'#4fd87a',wins:0},{name:'Ellos',score:0,color:'#f06060',wins:0}],settings:getGameSettings(),isFinished:false}}else if(!initialState&&state.game&&state.game.mode==='quick'){state.game.teams.forEach(t=>t.score=0);state.game.isFinished=false;state.game.settings=getGameSettings()}else if(initialState==='new_gallo'){const n1=(DOM.galloP1&&DOM.galloP1.value.trim())||'Jugador 1';const n2=(DOM.galloP2&&DOM.galloP2.value.trim())||'Jugador 2';const n3=(DOM.galloP3&&DOM.galloP3.value.trim())||'Jugador 3';state.game={mode:'gallo',teams:[{name:n1,score:0,color:'#4fd87a',wins:0},{name:n2,score:0,color:'#f06060',wins:0},{name:n3,score:0,color:'#e08030',wins:0}],settings:getGameSettings(),isFinished:false}}else{if(!initialState||!initialState.mode)return startGame('new_quick');state.game=initialState}renderGameUI();updatePicaPicaBanner();switchScreen('screenGame')}
function renderGameUI(){DOM.gameContainer.innerHTML='';if(state.game.mode==='gallo'){DOM.gameContainer.classList.add('gallo-mode')}else{DOM.gameContainer.classList.remove('gallo-mode')}state.game.teams.forEach((team,index)=>{const teamEl=document.createElement('div');teamEl.className=`card-bg rounded-2xl flex flex-col overflow-hidden card-j${index}`;teamEl.innerHTML=`<div class="team-name-container" data-team-index="${index}"><span class="team-name" style="color:${team.color}">${team.name}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.3;flex-shrink:0"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></div><div class="gold-div"></div><div class="tap-zone" data-team-index="${index}"><div class="team-score score-number text-center py-1" style="font-size:clamp(2.5rem,10vw,4rem);color:${team.color};text-shadow:0 0 20px ${team.color}40;flex-shrink:0">${team.score}</div><div class="gold-div"></div><div class="fosforo-container" style="flex:1;min-height:0"></div></div><div class="gold-div"></div><div style="padding:.4rem;flex-shrink:0"><button data-team-index="${index}" class="subtract-point-btn btn-score btn-score-subtract w-full mb-1">-1</button><button data-team-index="${index}" data-points="3" class="flor-btn btn-score btn-flor w-full ${state.game.settings.flor?'':'hidden'}">Flor</button></div>`;DOM.gameContainer.appendChild(teamEl);renderFosforos(index,team.score)});renderGameHistoryButton();showTutorial();}
function showTutorial(){if(localStorage.getItem('trucoTutorialShown'))return;localStorage.setItem('trucoTutorialShown','1');const card=DOM.gameContainer.children[0];if(!card)return;const tz=card.querySelector('.tap-zone');if(!tz)return;const bd=document.createElement('div');bd.className='tutorial-backdrop';document.body.appendChild(bd);card.classList.add('tutorial-card-active');const ov=document.createElement('div');ov.className='tutorial-overlay';ov.innerHTML='<span class="tutorial-finger">👆</span><span class="tutorial-txt">Toca para sumar</span>';tz.appendChild(ov);function doTap(rem){addPoints(0,1);if(rem>1){setTimeout(()=>doTap(rem-1),850);}else{setTimeout(()=>{pointUpdateQueue=[];isProcessingQueue=false;state.game.teams[0].score=0;const sc=card.querySelector('.team-score');if(sc)sc.textContent='0';renderFosforos(0,0);ov.remove();card.classList.remove('tutorial-card-active');bd.remove();},650);}}setTimeout(()=>doTap(3),700);}
function processPointQueue(){if(isProcessingQueue||pointUpdateQueue.length===0)return;isProcessingQueue=true;const{teamIndex,points}=pointUpdateQueue.shift();if(state.game.isFinished&&points>0){isProcessingQueue=false;processPointQueue();return}const team=state.game.teams[teamIndex];const oldScore=team.score;team.score=Math.min(state.game.settings.maxScore,Math.max(0,team.score+points));playSound(points>0?'point':'undo');updatePicaPicaBanner();saveAppState();const tc=DOM.gameContainer.children[teamIndex];if(tc){tc.querySelector('.team-score').textContent=team.score}checkSpecialEvents(teamIndex,oldScore,team.score);isProcessingQueue=false;if(pointUpdateQueue.length>0)requestAnimationFrame(processPointQueue)}
function addPoints(ti,pts){if(state.game.isFinished||state.game.teams[ti].score>=state.game.settings.maxScore)return;pointUpdateQueue.push({teamIndex:ti,points:pts});if(!isProcessingQueue)processPointQueue()}
function subtractPoint(ti){pointUpdateQueue.push({teamIndex:ti,points:-1});if(!isProcessingQueue)processPointQueue()}
function endGame(wi){state.game.isFinished=true;if(state.game.teams[wi].score>=30){triggerFullScreenFire();renderFosforos(wi,state.game.teams[wi].score)}playSound('win');const winner=state.game.teams[wi];const loser=state.game.teams[wi===0?1:0];const scoreText=`${winner.score} a ${loser.score}`;let body=`<p class="text-center text-xl">¡<span class="font-bold" style="color:#80ffb0">${winner.name}</span> ha ganado!</p><p class="text-center mt-2 text-lg">${scoreText}</p>`;let buttons=[];if(state.game.mode==='quick'){state.game.teams[wi].wins++;savePrefs();renderGameHistoryButton();buttons.push({text:'Jugar de Nuevo',classes:'btn-win',onClick:()=>startGame()})}else if(state.game.mode==='tournament'){const match=state.tournament.rounds[state.game.currentRoundIndex].matches[state.game.currentMatchIndex];match.winner=winner.name;match.score=scoreText;updateAndSaveTournamentHistory();buttons.push({text:'Volver al Torneo',classes:'btn-action',onClick:()=>{saveAppState();renderTournament();switchScreen('screenTournament')}})}saveAppState();buttons.push({text:'Menú Principal',classes:'btn-danger',onClick:()=>{try{const _p=JSON.parse(localStorage.getItem('trucoPrefsV1')||'{}');_p.quickWins=[0,0];localStorage.setItem('trucoPrefsV1',JSON.stringify(_p));}catch(e){}localStorage.removeItem('trucoAppStateV1');switchScreen('screenSetup')}});showModal('Partida Finalizada',body,buttons,true)}
function renderGameHistoryButton(){DOM.gameHistoryBtnContainer.innerHTML='';if(state.game.mode==='quick'){const btn=document.createElement('button');btn.className='btn btn-action py-2 px-3 text-xs';btn.textContent=`${state.game.teams[0].wins} — ${state.game.teams[1].wins}`;btn.onclick=()=>showModal('Historial',`<p class="text-center text-lg">${state.game.teams[0].name}: ${state.game.teams[0].wins} vic.</p><p class="text-center text-lg mt-2">${state.game.teams[1].name}: ${state.game.teams[1].wins} vic.</p>`);DOM.gameHistoryBtnContainer.appendChild(btn)}}
function createTallyGroup(type,isBurnt){const g=document.createElement('div');g.className='fosforo-group';g.innerHTML=`<div class="fosforo ${type} ${isBurnt?'quemado':''}" style="width:4px;height:43px;top:0;left:0"></div><div class="fosforo ${type} ${isBurnt?'quemado':''}" style="width:45px;height:4px;top:0;left:0;transform:scaleX(-1);transform-origin:center"></div><div class="fosforo ${type} ${isBurnt?'quemado':''}" style="width:4px;height:43px;top:0;left:41px;transform:scaleY(-1);transform-origin:center"></div><div class="fosforo ${type} ${isBurnt?'quemado':''}" style="width:45px;height:4px;top:41px;left:0"></div><div class="fosforo ${type} ${isBurnt?'quemado':''}" style="width:4px;height:62px;top:-9px;left:20.5px;transform:rotate(45deg)"></div>`;return g}
function renderTally(score,type,isBurnt){const c=document.createElement('div');c.className='w-full';c.dataset.tallyType=type;if(score>0){c.innerHTML=`<div class="tally-label ${type}">${type==='malas'?'Malas':'Buenas'}</div>`;const inner=document.createElement('div');inner.className='tally-groups-row';const full=Math.floor(score/5);const rem=score%5;for(let i=0;i<full;i++)inner.appendChild(createTallyGroup(type,isBurnt));if(rem>0){const g=document.createElement('div');g.className='fosforo-group';let h='';if(rem>=1)h+=`<div class="fosforo ${type} ${isBurnt?'quemado':''}" style="width:4px;height:43px;top:0;left:0"></div>`;if(rem>=2)h+=`<div class="fosforo ${type} ${isBurnt?'quemado':''}" style="width:45px;height:4px;top:0;left:0;transform:scaleX(-1);transform-origin:center"></div>`;if(rem>=3)h+=`<div class="fosforo ${type} ${isBurnt?'quemado':''}" style="width:4px;height:43px;top:0;left:41px;transform:scaleY(-1);transform-origin:center"></div>`;if(rem>=4)h+=`<div class="fosforo ${type} ${isBurnt?'quemado':''}" style="width:45px;height:4px;top:41px;left:0"></div>`;g.innerHTML=h;inner.appendChild(g)}c.appendChild(inner)}return c}
function renderFosforos(ti,score){const tc=DOM.gameContainer.children[ti];if(!tc)return;const fc=tc.querySelector('.fosforo-container');if(!fc)return;const mx=state.game.settings.maxScore;const split=mx===40?20:15;fc.innerHTML='';fc.appendChild(renderTally(Math.min(score,split),'malas',score>=split));if(mx!==15)fc.appendChild(renderTally(Math.max(0,score-split),'buenas',score>=mx))}
function checkSpecialEvents(ti,oldScore,newScore){const mx=state.game.settings.maxScore;const half=mx===40?20:mx===30?15:null;renderFosforos(ti,newScore);if(newScore>=mx&&oldScore<mx)endGame(ti);else if(half&&newScore>=half&&oldScore<half){triggerFullScreenFire();renderFosforos(ti,newScore)}if(newScore===mx-1)triggerCLPModal()}
function triggerFullScreenFire(){triggerShimmerAnimation()}
function spawnFire(ov,n,md,mx){const g=['radial-gradient(circle,rgba(255,255,150,.95) 0%,rgba(255,200,0,.8) 30%,rgba(255,90,0,.45) 70%,transparent 100%)','radial-gradient(circle,rgba(255,220,0,.9) 0%,rgba(255,140,0,.75) 40%,rgba(255,40,0,.3) 80%,transparent 100%)','radial-gradient(circle,rgba(255,170,0,.85) 0%,rgba(255,80,0,.65) 50%,rgba(200,20,0,.2) 85%,transparent 100%)'];for(let i=0;i<n;i++){const p=document.createElement('div');p.className='particle';const sz=Math.random()*65+18;const h=(sz*1.25).toFixed(0);const l=Math.random()*100;const d=(Math.random()*md+.9).toFixed(2);const dl=(Math.random()*mx).toFixed(2);const sx=(Math.random()*90-45).toFixed(0);p.style.cssText=`width:${sz}px;height:${h}px;left:${l}%;background:${g[i%3]};--dur:${d}s;--del:${dl}s;--sx:${sx}px;`;ov.appendChild(p);}}
function triggerShimmerAnimation(){playSound('fire');const ov=DOM.fireOverlay;ov.innerHTML='';spawnFire(ov,110,1.0,.35);setTimeout(()=>ov.innerHTML='',2400)}

function updatePicaPicaBanner(){if(!state.game||!state.game.settings.picaPica){DOM.picaPicaBanner.classList.remove('visible');return}const scores=state.game.teams.map(t=>t.score);DOM.picaPicaBanner.classList.toggle('visible',scores.some(s=>s>=5)&&!scores.some(s=>s>20))}
function triggerCLPModal(){DOM.clpModal.style.display='flex';setTimeout(()=>{DOM.clpModal.style.display='none'},1000)}
function formatTeamName(players){if(players.length<2)return players.join('');if(players.length===2)return players.join(' y ');return players.slice(0,-1).join(', ')+' y '+players.slice(-1)}
function createTournament(){const pc=parseInt(DOM.playerCount.value);const ppt=parseInt(DOM.playersPerTeam.value);const inputs=DOM.playerNamesContainer.querySelectorAll('input');const names=Array.from(inputs).map(i=>i.value.trim()||i.placeholder);if(new Set(names).size!==names.length){DOM.tournamentError.classList.remove('hidden');return}DOM.tournamentError.classList.add('hidden');const isRandom=DOM.randomTeamsToggle.checked;const ordered=isRandom?[...names].sort(()=>.5-Math.random()):names;const teams=[];for(let i=0;i<pc;i+=ppt)teams.push(formatTeamName(ordered.slice(i,i+ppt)));state.tournament={id:`torneo_${Date.now()}`,teams,rounds:[],settings:{...getGameSettings(),playersPerTeam:ppt}};addTournamentRound();const h=loadGeneralHistory();h.tournaments.push({...state.tournament});saveGeneralHistory(h);renderTournament();switchScreen('screenTournament')}
function addTournamentRound(){const shuffled=[...state.tournament.teams].sort(()=>.5-Math.random());const matches=[];for(let i=0;i<shuffled.length;i+=2)if(shuffled[i+1])matches.push({teamA:shuffled[i],teamB:shuffled[i+1],winner:null,score:null});state.tournament.rounds.push({matches});renderTournament()}
function renderTournament(){DOM.roundsContainer.innerHTML='';state.tournament.rounds.forEach((round,ri)=>{const div=document.createElement('div');div.className='rounded-xl p-3';div.style.cssText='background:rgba(0,0,0,.25);border:1px solid var(--golddim)';div.innerHTML=`<h3 class="pf text-base mb-2" style="color:var(--accentl)">Ronda ${ri+1}</h3>`;const mc=document.createElement('div');mc.className='space-y-2';round.matches.forEach((m,mi)=>mc.appendChild(createMatchElement(ri,m,mi)));div.appendChild(mc);DOM.roundsContainer.appendChild(div)})}
function createMatchElement(ri,match,mi){const div=document.createElement('div');div.className='flex items-center justify-between gap-2 p-2 rounded-lg';div.style.cssText='background:rgba(0,0,0,.3);border:1px solid var(--golddim)';if(match.winner){const wa=match.teamA===match.winner;div.innerHTML=`<div class="flex-1 text-left truncate text-sm font-semibold" style="color:${wa?'#80ffb0':'#5a6e5a'}">${match.teamA}</div><div class="flex-shrink-0 text-xs px-2 py-1 rounded-full" style="background:rgba(0,0,0,.4);color:var(--accentl)">${match.score}</div><div class="flex-1 text-right truncate text-sm font-semibold" style="color:${!wa?'#80ffb0':'#5a6e5a'}">${match.teamB}</div>`}else{const allTeams=state.tournament.teams;const upd=(s1,s2)=>Array.from(s2.options).forEach(o=>{o.disabled=o.value===s1.value&&s1.value!==''});const sA=createTeamSelect(allTeams,match.teamA);const sB=createTeamSelect(allTeams,match.teamB);sA.onchange=e=>{state.tournament.rounds[ri].matches[mi].teamA=e.target.value;upd(sA,sB)};sB.onchange=e=>{state.tournament.rounds[ri].matches[mi].teamB=e.target.value;upd(sB,sA)};const pb=document.createElement('button');pb.textContent='Jugar';pb.className='btn btn-action py-1 px-2 text-xs';pb.onclick=()=>{const cm=state.tournament.rounds[ri].matches[mi];if(cm.teamA&&cm.teamB&&cm.teamA!==cm.teamB)startGame({mode:'tournament',teams:[{name:cm.teamA,score:0,color:'#4fd87a'},{name:cm.teamB,score:0,color:'#f06060'}],settings:state.tournament.settings,isFinished:false,currentRoundIndex:ri,currentMatchIndex:mi});else showModal('Error','<p>Selecciona dos equipos diferentes.</p>')};div.append(sA,document.createTextNode(' vs '),sB,pb);upd(sA,sB);upd(sB,sA)}return div}
function createTeamSelect(teams,sel){const s=document.createElement('select');s.className='input-field text-xs';s.style.cssText='padding:.25rem .4rem;width:40%';s.innerHTML=`<option value="">Elegir...</option>`+teams.map(t=>`<option value="${t}"${t===sel?' selected':''}>${t}</option>`).join('');return s}
function showAddTeamModal(){if(!state.tournament)return;const ppt=state.tournament.settings.playersPerTeam;const nextNum=state.tournament.teams.length*ppt+1;let html=Array.from({length:ppt},(_,i)=>`<input type="text" class="new-player-input input-field mb-2" placeholder="Jugador ${nextNum+i}">`).join('');showModal('Añadir Pareja',`<div>${html}</div>`,[{text:'Cancelar',classes:'btn-danger'},{text:'Añadir',classes:'btn-action',onClick:()=>{const inputs=document.querySelectorAll('.new-player-input');const names=Array.from(inputs).map(i=>i.value.trim()||i.placeholder);const existing=state.tournament.teams.flatMap(t=>t.split(/, | y /));const allNew=[...existing,...names];if(new Set(allNew).size!==allNew.length||new Set(names).size!==names.length){showModal('Error','<p>Nombres duplicados.</p>',[],true);return}state.tournament.teams.push(formatTeamName(names));updateAndSaveTournamentHistory();saveAppState();renderTournament();hideModal()}}])}

function saveAppState(){try{localStorage.setItem('trucoAppStateV1',JSON.stringify({game:state.game||null,tournament:state.tournament||null}))}catch(e){}}
function loadAppState(){try{const s=localStorage.getItem('trucoAppStateV1');if(!s)return false;const d=JSON.parse(s);if(d.tournament)state.tournament=d.tournament;if(d.game&&!d.game.isFinished){state.game=d.game;renderGameUI();updatePicaPicaBanner();switchScreen('screenGame');return true}else if(d.tournament){renderTournament();switchScreen('screenTournament');return true}}catch(e){}return false}
function loadGeneralHistory(){return JSON.parse(localStorage.getItem('trucoHistoryV27'))||{tournaments:[]}}
function saveGeneralHistory(h){if(h.tournaments.length>50)h.tournaments=h.tournaments.slice(-50);localStorage.setItem('trucoHistoryV27',JSON.stringify(h))}
function updateAndSaveTournamentHistory(){if(!state.tournament||!state.tournament.id)return;const h=loadGeneralHistory();const idx=h.tournaments.findIndex(t=>t.id===state.tournament.id);if(idx!==-1){h.tournaments[idx]=JSON.parse(JSON.stringify(state.tournament));saveGeneralHistory(h)}}
function showTournamentHistory(page){page=page||0;const h=loadGeneralHistory();if(!h.tournaments.length){showModal('Historial','<p class="text-center">Sin historial aún.</p>');return}
const all=[...h.tournaments].reverse();
const perPage=5;const total=Math.ceil(all.length/perPage);const start=page*perPage;const slice=all.slice(start,start+perPage);
let html=slice.map(t=>{const date=new Date(parseInt(t.id.split('_')[1])).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});const teams=t.teams?t.teams.join(', '):'';const rounds=t.rounds.map((r,ri)=>`<p class="text-xs mt-1 font-semibold" style="color:var(--muted)">Ronda ${ri+1}</p>${r.matches.filter(m=>m.winner).map(m=>`<p class="text-xs ml-2">✓ <span style="color:#80ffb0">${m.winner}</span> (${m.score})</p>`).join('')}`).join('');return`<div class="mb-3 pb-3" style="border-bottom:1px solid var(--golddim)"><p class="font-bold text-sm" style="color:var(--accentl)">${date}</p><p class="text-xs mb-1" style="color:var(--muted)">${teams}</p>${rounds}</div>`}).join('');
let footer=[];if(total>1){const info=`<span class="text-xs" style="color:var(--muted)">${page+1} / ${total}</span>`;html=`<div class="text-center mb-2">${info}</div>`+html;if(page>0)footer.push({text:'◀ Anterior',classes:'btn-action',closesModal:false,onClick:()=>showTournamentHistory(page-1)});if(page<total-1)footer.push({text:'Siguiente ▶',classes:'btn-action',closesModal:false,onClick:()=>showTournamentHistory(page+1)});}
footer.push({text:'Cerrar',classes:'btn-danger'});
showModal(`Historial (${all.length} torneo${all.length!==1?'s':''})`,html,footer);}

function promptForNameChange(ti){const team=state.game.teams[ti];const orig=team.name;showModal('Cambiar Nombre',`<input type="text" id="edit-name-input" class="input-field" value="${team.name}">`,[{text:'Cancelar',classes:'btn-danger'},{text:'Guardar',classes:'btn-action',onClick:()=>{const nv=document.getElementById('edit-name-input').value.trim();if(nv){team.name=nv;const el=DOM.gameContainer.children[ti].querySelector('.team-name');if(el)el.textContent=nv;renderGameHistoryButton();saveAppState();if(state.game.mode==='tournament'&&nv!==orig){const idx=state.tournament.teams.indexOf(orig);if(idx>-1)state.tournament.teams[idx]=nv;state.tournament.rounds.forEach(r=>r.matches.forEach(m=>{if(m.teamA===orig)m.teamA=nv;if(m.teamB===orig)m.teamB=nv;if(m.winner===orig)m.winner=nv}));updateAndSaveTournamentHistory()}}hideModal()}}]);setTimeout(()=>{const el=document.getElementById('edit-name-input');if(el)el.focus()},100)}

function updateSoundButton(){DOM.soundToggleBtn.innerHTML=soundEnabled?ICONS.soundOn:ICONS.soundOff}
function generatePlayerNameInputs(){const count=parseInt(DOM.playerCount.value);const ppt=parseInt(DOM.playersPerTeam.value);const isRandom=DOM.randomTeamsToggle.checked;let html='';for(let i=0;i<count;i++){if(!isRandom&&i%ppt===0){const tn=Math.floor(i/ppt)+1;html+=`<div class="text-xs font-bold tracking-widest uppercase mt-2 mb-1" style="color:var(--accentl)">Pareja ${tn}</div>`;}html+=`<input type="text" placeholder="Jugador ${i+1}" class="input-field text-sm">`;if(i<count-1)html+='<div class="h-1"></div>';}DOM.playerNamesContainer.innerHTML=html;}
function init(){setViewportHeight();window.addEventListener('resize',setViewportHeight);window.addEventListener('orientationchange',()=>{setTimeout(setViewportHeight,100);});window.addEventListener('orientationchange',()=>{setTimeout(setViewportHeight,100);});updateSoundButton();DOM.gameMode.addEventListener('change',e=>{const isTournament=e.target.value==='tournament';const isGallo=e.target.value==='gallo';DOM.tournamentSetup.classList.toggle('hidden',!isTournament);DOM.galloSetup.classList.toggle('hidden',!isGallo);DOM.startBtn.textContent=isTournament?'Crear Torneo':isGallo?'Iniciar Gallo':'Empezar Partida';updatePicaPicaAvailability();savePrefs()});DOM.playerCount.addEventListener('input',()=>{generatePlayerNameInputs();savePrefs();});DOM.randomTeamsToggle.addEventListener('change',()=>{generatePlayerNameInputs();savePrefs();});DOM.maxScore.addEventListener('change',savePrefs);DOM.playersPerTeam.addEventListener('change',()=>{updatePicaPicaAvailability();generatePlayerNameInputs();savePrefs();});DOM.startBtn.addEventListener('click',()=>{playSound('click');if(DOM.gameMode.value==='quick')startGame('new_quick');else if(DOM.gameMode.value==='gallo'){startGame('new_gallo');}else createTournament()});DOM.backToMenuBtn.addEventListener('click',()=>{
playSound('click');
const inGame=state.game&&!state.game.isFinished;
const hasScore=inGame&&state.game.teams.some(t=>t.score>0);
if(inGame&&hasScore){
showModal('Volver al Menú','<p class="text-center text-base">Si volvés al menú <span style="color:#ffaaaa;font-weight:bold">se perderá la partida en curso</span>.<br><br>¿Estás seguro?</p>',[
{text:'Cancelar',classes:'btn-action'},
{text:'Sí, Volver',classes:'btn-danger',onClick:()=>{
if(state.game.mode==='tournament'){state.game=null;saveAppState();renderTournament();switchScreen('screenTournament');}
else{if(state.game&&state.game.mode==='quick')state.game.teams.forEach(t=>t.wins=0);savePrefs();state.game=null;try{localStorage.removeItem('trucoAppStateV1')}catch(e){}switchScreen('screenSetup');}
}}],false);
}else{
if(state.game&&state.game.mode==='tournament'){state.game=null;saveAppState();renderTournament();switchScreen('screenTournament');}
else{try{const _p=JSON.parse(localStorage.getItem('trucoPrefsV1')||'{}');_p.quickWins=[0,0];localStorage.setItem('trucoPrefsV1',JSON.stringify(_p));}catch(e){}state.game=null;try{localStorage.removeItem('trucoAppStateV1')}catch(e){}switchScreen('screenSetup');}
}
});DOM.backToSetupBtn.addEventListener('click',()=>{playSound('click');state.game=null;state.tournament=null;try{localStorage.removeItem('trucoAppStateV1')}catch(e){}switchScreen('screenSetup');});DOM.gameContainer.addEventListener('click',e=>{const btn=e.target.closest('button');if(btn){const ti=parseInt(btn.dataset.teamIndex);if(btn.classList.contains('flor-btn'))addPoints(ti,parseInt(btn.dataset.points));else if(btn.classList.contains('subtract-point-btn'))subtractPoint(ti);return}const tz=e.target.closest('.tap-zone');if(tz){addPoints(parseInt(tz.dataset.teamIndex),1);return}const nc=e.target.closest('.team-name-container');if(nc)promptForNameChange(parseInt(nc.dataset.teamIndex))});DOM.soundToggleBtn.addEventListener('click',()=>{soundEnabled=!soundEnabled;playSound('click');updateSoundButton();savePrefs()});DOM.body.addEventListener('click',()=>{Tone.start();if(!soundsInitialized){setupSounds();soundsInitialized=true;}});DOM.modalContainer.addEventListener('click',e=>{if(e.target===DOM.modalContainer&&!e.currentTarget.dataset.blocking)hideModal()});DOM.modalCloseBtn.addEventListener('click',hideModal);DOM.addRoundBtn.addEventListener('click',()=>{playSound('click');addTournamentRound()});DOM.addTeamBtn.addEventListener('click',()=>{playSound('click');showAddTeamModal()});DOM.tournamentHistoryBtn.addEventListener('click',()=>{playSound('click');showTournamentHistory();});DOM.finishTournamentBtn.addEventListener('click',()=>{playSound('click');showModal('Finalizar Torneo','<p class="text-center">¿Finalizar el torneo actual y volver al menú? El historial se conserva.</p>',[{text:'Cancelar',classes:'btn-action'},{text:'Finalizar',classes:'btn-danger',onClick:()=>{state.tournament=null;state.game=null;try{localStorage.removeItem('trucoAppStateV1')}catch(e){}switchScreen('screenSetup');}}]);});generatePlayerNameInputs();updatePicaPicaAvailability();loadPrefs();generatePlayerNameInputs();applyWakeLock();loadAppState();if(DOM.keepAwakeToggle)DOM.keepAwakeToggle.addEventListener('change',()=>{savePrefs();applyWakeLock();});}
window.addEventListener('beforeunload',saveAppState);document.addEventListener('DOMContentLoaded',init);
</script>
</body></html>
